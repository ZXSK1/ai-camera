<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10141b" />
  <title>AI Camera v0.2</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;color-scheme:dark;--muted:#9ca8bc;--accent:#b6f4d1}
    *{box-sizing:border-box}
    body{margin:0;background:#10141b;color:#fff;min-height:100dvh;display:flex;flex-direction:column}
    header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
    .brand{font-weight:750;letter-spacing:.03em;font-size:19px}.brand span{font-size:11px;font-weight:500;margin-left:8px;color:var(--muted)}
    .modepill{font-size:12px;border:1px solid #506073;padding:6px 9px;border-radius:20px;color:#b7c7d9}
    main{width:100%;max-width:560px;margin:0 auto}
    .view{position:relative;width:100%;aspect-ratio:3/4;background:#202c36;overflow:hidden;touch-action:manipulation;transition:aspect-ratio .18s}
    .view.wide{aspect-ratio:16/9}
    video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:translateZ(0)}
    .placeholder{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#334753,#1b2530 75%);pointer-events:none}
    .placeholder svg{opacity:.38}
    .view.started .placeholder{display:none}
    .grid{position:absolute;inset:0;pointer-events:none;opacity:.4;background:linear-gradient(to right,transparent 33.2%,#fff9 33.33%,transparent 33.46%,transparent 66.55%,#fff9 66.67%,transparent 66.8%),linear-gradient(to bottom,transparent 33.2%,#fff9 33.33%,transparent 33.46%,transparent 66.55%,#fff9 66.67%,transparent 66.8%)}
    .target{position:absolute;width:62px;height:62px;border:2px dashed var(--accent);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:2;box-shadow:0 0 18px #0006}
    .face{position:absolute;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #0005,0 0 20px #0008;transform:translate(-50%,-50%);pointer-events:none;z-index:2;display:none;transition:left .085s linear,top .085s linear,width .085s linear,height .085s linear}
    .arrow{position:absolute;z-index:4;transform:translate(-50%,-100%);min-width:46px;background:#0c1018dc;border:1px solid #ffffff55;border-radius:16px;padding:4px 11px;font-size:26px;font-weight:900;line-height:1.2;pointer-events:none;display:none}
    .toast{position:absolute;top:12px;left:7%;width:86%;border-radius:12px;background:#0d1420b9;backdrop-filter:blur(10px);padding:10px 12px;text-align:center;font-weight:650;font-size:14px;z-index:4;pointer-events:none}
    .bottomtag{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:20px;background:#101820b3;font-size:11px;white-space:nowrap;color:#e0e6ee;pointer-events:none}
    .picker{display:flex;gap:9px;align-items:center;justify-content:center;padding:15px 10px 4px}
    .preset{background:#202c3a;border:1px solid #3a4a58;border-radius:100px;color:#e7ecf2;padding:9px 15px;font-size:14px;cursor:pointer}
    .preset.active{background:#e8f3eb;color:#142219;border-color:#e8f3eb;font-weight:700}
    .toolbar{display:flex;gap:12px;justify-content:space-evenly;align-items:center;padding:12px 12px}
    button{font-family:inherit;touch-action:manipulation}
    .control{padding:10px 14px;border:1px solid #38495c;border-radius:13px;background:#273445;color:white;font-size:14px;min-height:46px;cursor:pointer}
    .shutter{width:67px;height:67px;border-radius:50%;background:white;border:5px solid #a6afb7;box-shadow:inset 0 0 0 4px white;flex-shrink:0}
    .shutter:active{transform:scale(.97)}
    .switchline{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:22px;margin:4px 0 0;font-size:13px;color:#d2dce8}
    .switchline label{display:flex;align-items:center;gap:6px;cursor:pointer}
    input[type=checkbox]{accent-color:#9ce6ba;width:17px;height:17px}
    .status{text-align:center;font-size:12px;color:#8de1ae;margin:14px auto 5px;max-width:95%;min-height:16px}
    .detail{text-align:center;padding:0 17px 22px;font-size:12px;color:#9aaabe;line-height:1.65}
    .detail b{color:#ccd9e7;font-weight:600}
    @media(max-width:400px){header{height:55px}.picker{padding-top:11px}.toolbar{padding:9px}.control{font-size:12px;padding:8px 12px}.shutter{width:60px;height:60px}}
  </style>
</head>
<body>
<header><div class="brand">AI CAMERA <span>v0.2 · Prototype</span></div><div class="modepill" id="modelTag">视觉模型：未启动</div></header>
<main>
  <div id="view" class="view" aria-label="相机取景画面。点击任意位置，可手动设置主体位置">
    <video id="video" muted autoplay playsinline></video>
    <div class="placeholder"><svg width="80" height="80" viewBox="0 0 24 24" stroke="white" fill="none" stroke-width="1.3"><path d="M14 4h-4L8.2 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-4.2L14 4Z"/><circle cx="12" cy="13" r="4"/></svg></div>
    <div class="grid"></div><div id="target" class="target"></div><div id="face" class="face"></div><div id="arrow" class="arrow"></div>
    <div id="toast" class="toast" aria-live="polite">开启相机后，系统会自动寻找面部</div>
    <div class="bottomtag" id="bottomtag">当前模板：日系清透</div>
  </div>
  <div class="picker" role="group" aria-label="拍摄风格">
    <button class="preset active" data-style="japan">日系清透</button>
    <button class="preset" data-style="cinema">电影氛围</button>
    <button class="preset" data-style="natural">自然</button>
  </div>
  <div class="toolbar"><button class="control" id="start">开启相机</button><button class="shutter" id="capture" aria-label="拍照保存"></button><button class="control" id="flip">切换镜头</button></div>
  <div class="switchline"><label><input id="live" type="checkbox" checked>实时风格预览</label><label><input id="eco" type="checkbox">节能识别</label></div>
  <div class="status" id="status">准备就绪 · 只需 Safari</div>
  <div class="detail"><b>箭头贴近人物：</b>根据面部在画面中的位置，提示调整手机。绿色虚线圈表示目标位置。<br/>未检测到人脸时可点击画面手动选点。首次联网下载识别模型后，逐帧分析在设备本地进行；无需上传视频。这里只是基础构图实验，尚不能复刻真实光照或完整人物姿态。</div>
</main>
<script type="module">
const $ = id => document.getElementById(id);
const video=$('video'),view=$('view'),face=$('face'),arrow=$('arrow'),target=$('target'),toast=$('toast'),status=$('status'),modelTag=$('modelTag'),bottomtag=$('bottomtag'),eco=$('eco'),live=$('live');
const looks={
 japan:{title:'日系清透',x:.34,y:.38,faceRatio:.15,filter:'brightness(1.12) contrast(.88) saturate(.79)'},
 cinema:{title:'电影氛围',x:.67,y:.40,faceRatio:.13,filter:'contrast(1.22) saturate(.83) sepia(.13)'},
 natural:{title:'自然',x:.50,y:.39,faceRatio:.17,filter:'none'}
};
let style='japan',facing='environment',stream=null,detector=null,modelLoading=false;
let tracked=null,manual=null,startedLoop=false,lastSeen=-1e10,lastDetect=0,failedInference=0;
const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
function activeLook(){return looks[style]}
function updateAppearance(){
 const p=activeLook();
 document.querySelectorAll('.preset').forEach(x=>x.classList.toggle('active',x.dataset.style===style));
 video.style.filter=live.checked?p.filter:'none';
 view.classList.toggle('wide',style==='cinema');bottomtag.textContent='当前模板：'+p.title;
 target.style.left=(100*p.x)+'%';target.style.top=(100*p.y)+'%';
 tracked=null;manual=null;face.style.display=arrow.style.display='none';
 if(stream)toast.textContent='寻找人物面部…';
}
function statusMessage(s){status.textContent=s}
document.querySelectorAll('.preset').forEach(x=>x.onclick=()=>{style=x.dataset.style;updateAppearance()});
live.onchange=updateAppearance;
function project(b){
 const vw=video.videoWidth,vh=video.videoHeight,sw=view.clientWidth,sh=view.clientHeight;
 if(!vw||!vh)return null;
 const scale=Math.max(sw/vw,sh/vh),offsetX=(sw-vw*scale)/2,offsetY=(sh-vh*scale)/2;
 return{x:(b.originX+b.width/2)*scale+offsetX,y:(b.originY+b.height/2)*scale+offsetY,w:b.width*scale};
}
function present(p,automatic){
 const sw=view.clientWidth,sh=view.clientHeight,pr=activeLook(),dx=pr.x-p.x/sw,dy=pr.y-p.y/sh;
 const size=p.w/sw;
 let direction='✓',msg='构图位置已接近目标，可以拍摄';
 if(automatic&&size>pr.faceRatio*1.8){direction='↔';msg='后退一点，给画面更多环境';}
 else if(automatic&&size<pr.faceRatio*.55){direction='↔';msg='靠近一点，让人物更突出';}
 else if(Math.abs(dx)>.065||Math.abs(dy)>.07){
   if(Math.abs(dx)>.95*Math.abs(dy)){
    direction=dx>0?'←':'→';msg=dx>0?'手机向左转，让人物移向右侧':'手机向右转，让人物移向左侧';
   }else{direction=dy>0?'↑':'↓';msg=dy>0?'抬高手机，让人物向下进入目标':'降低手机，让人物向上进入目标';}
 }
 let rad=clamp(p.w*.55,24,78),x=clamp(p.x,15,sw-15),y=clamp(p.y,15,sh-15);
 face.style.display=arrow.style.display='block';face.style.left=x+'px';face.style.top=y+'px';
 face.style.width=(rad*2)+'px';face.style.height=(rad*2)+'px';
 arrow.style.left=clamp(x,30,sw-30)+'px';arrow.style.top=clamp(y-rad-3,52,sh-25)+'px';
 arrow.textContent=direction;toast.textContent=msg;
}
async function getModel(){
 if(detector||modelLoading)return;
 modelLoading=true;modelTag.textContent='下载识别模型中';statusMessage('首次加载人脸检测模型，需要网络连接…');
 try{
  const mp=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs');
  const vision=await mp.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');
  detector=await mp.FaceDetector.createFromOptions(vision,{
   baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite',delegate:'CPU'},
   runningMode:'VIDEO',minDetectionConfidence:.55
  });
  modelTag.textContent='人脸识别 · 本地';statusMessage('AI 识别已就绪，正在寻找人物面部');
 }catch(err){console.error('Face model load failed',err);modelTag.textContent='手动构图模式';statusMessage('AI 模型未加载成功。可点击人物位置，继续手动引导。');}
 finally{modelLoading=false;}
}
async function beginCamera(){
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw Error('请使用 HTTPS 网站并允许 Safari 使用相机');
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}});
  video.srcObject=stream;await video.play();
  view.classList.add('started');tracked=manual=null;face.style.display=arrow.style.display='none';
  toast.textContent='将人物面部放进取景框';statusMessage('相机已开启');
  if(!startedLoop){startedLoop=true;requestAnimationFrame(tick)}
  if(!detector)getModel();
 }catch(err){console.error('Camera error',err);toast.textContent='无法开启相机，请检查权限';statusMessage(err.message||'请检查相机权限');}
}
$('start').onclick=beginCamera;
$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';if(stream)beginCamera();else statusMessage('已切换默认镜头，点击开启相机')};
let inInference=false;
function tick(t){
 requestAnimationFrame(tick);
 if(!stream||!detector||inInference||video.readyState<2)return;
 if(t-lastDetect<(eco.checked?350:125))return;
 lastDetect=t;inInference=true;
 try{
  const res=detector.detectForVideo(video,t),ds=(res.detections||[]).filter(d=>d.boundingBox);
  if(ds.length){
   // Keep the largest face as the current target. Multi-person selection is a future feature.
   ds.sort((a,b)=>b.boundingBox.width*b.boundingBox.height-a.boundingBox.width*a.boundingBox.height);
   const pos=project(ds[0].boundingBox);
   if(pos){tracked=tracked?{x:tracked.x*.68+pos.x*.32,y:tracked.y*.68+pos.y*.32,w:tracked.w*.68+pos.w*.32}:pos;
    lastSeen=t;manual=null;present(tracked,true);statusMessage('人脸跟踪中 · '+(eco.checked?'节能':'标准')+'模式');}
  }else if(t-lastSeen>1100){
    tracked=null;if(manual){present(manual,false);statusMessage('手动选点模式');}
    else{face.style.display=arrow.style.display='none';toast.textContent='寻找人物面部…';statusMessage('未发现人脸 · 点击主体可手动选点');}
  }
 }catch(err){failedInference++;if(failedInference===1)console.error(err);if(failedInference>4){detector=null;modelTag.textContent='手动构图模式';statusMessage('AI 检测出现问题，可点击主体手动构图');}}
 finally{inInference=false;}
}
view.addEventListener('click',e=>{
 if(!stream)return;
 const rect=view.getBoundingClientRect();manual={x:e.clientX-rect.left,y:e.clientY-rect.top,w:65};
 tracked=null;lastSeen=-1e10;
 present(manual,false);statusMessage('手动选点模式 · AI 识别成功时将自动接管');
});
$('capture').onclick=()=>{
 if(!stream||!video.videoWidth){statusMessage('请先开启相机');return;}
 // Match current preview aspect ratio and crop, but export without interface overlays.
 const sw=view.clientWidth,sh=view.clientHeight,vw=video.videoWidth,vh=video.videoHeight;
 const scale=Math.max(sw/vw,sh/vh),srcW=sw/scale,srcH=sh/scale,sx=(vw-srcW)/2,sy=(vh-srcH)/2;
 const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(Math.min(srcW,2400)));canvas.height=Math.max(1,Math.round(canvas.width*sh/sw));
 const ctx=canvas.getContext('2d');ctx.filter=activeLook().filter;
 // Front camera preview can be device-specific; saved image uses the unmirrored sensor frame.
 ctx.drawImage(video,sx,sy,srcW,srcH,0,0,canvas.width,canvas.height);
 canvas.toBlob(blob=>{
  if(!blob){statusMessage('照片生成失败');return;}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='AI-Camera-'+style+'-'+Date.now()+'.jpg';a.click();
  statusMessage('照片已生成。若 Safari 打开图片预览，请使用分享菜单保存图像。');
  setTimeout(()=>URL.revokeObjectURL(url),60000);
 },'image/jpeg',.93);
};
window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});
updateAppearance();
</script>
</body>
</html>
