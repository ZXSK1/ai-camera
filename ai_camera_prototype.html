<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>AI Camera Prototype</title><style>body{margin:0;background:#10151b;color:white;font:16px -apple-system,Arial;text-align:center}header{padding:16px}#stage{position:relative;width:100%;max-width:600px;margin:auto;background:#29333c;aspect-ratio:3/4;overflow:hidden}video,canvas{position:absolute;width:100%;height:100%;left:0;top:0;object-fit:cover}#grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent 33.1%,#ffffff65 33.3%,transparent 33.5%,transparent 66.4%,#ffffff65 66.6%,transparent 66.8%),linear-gradient(to bottom,transparent 33.1%,#ffffff65 33.3%,transparent 33.5%,transparent 66.4%,#ffffff65 66.6%,transparent 66.8%)}#target{position:absolute;left:66.67%;top:50%;width:48px;height:48px;border:2px dashed #8ef5b0;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}#mark{position:absolute;border:2px solid white;width:54px;height:54px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;display:none}#tip{position:absolute;top:16px;left:10%;width:80%;padding:10px 0;background:#0009;border-radius:12px;font-weight:600}button,select{background:#293f54;color:white;border:1px solid #698099;border-radius:10px;padding:12px;margin:8px;font-size:15px}#shot{background:white;color:black}small{color:#b4c4d2;display:block;padding:12px;line-height:1.5}</style><header><b>AI Camera · 构图引导原型</b></header><div id="stage"><video id="video" autoplay muted playsinline></video><div id="grid"></div><div id="target"></div><div id="mark"></div><div id="tip">启动摄像头后，点击画面中的主体</div></div><div><button id="start">开启相机</button><button id="shot">拍照保存</button></div><div><label>风格 <select id="style"><option value="none">自然</option><option value="cinema">电影感</option><option value="japan">日系</option></select></label><label><input id="preview" type="checkbox" checked> 实时色调预览</label></div><small>点击人物位置设置追踪点；绿色虚线圈是目标构图位置。原型仅演示单帧主体定位与动作指引，不包含自动人物识别或真实运动追踪。相机需要 HTTPS 或 localhost 环境。</small><script>const v=document.querySelector('#video'),stage=document.querySelector('#stage'),tip=document.querySelector('#tip'),mark=document.querySelector('#mark'),style=document.querySelector('#style'),preview=document.querySelector('#preview');let pt=null;function filt(){return !preview.checked?'none':style.value==='cinema'?'contrast(1.25) saturate(.8) sepia(.18)':style.value==='japan'?'brightness(1.12) contrast(.88) saturate(.78)':'none'}function update(){v.style.filter=filt()}style.onchange=preview.onchange=update;document.querySelector('#start').onclick=async()=>{try{v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});tip.textContent='点击画面中要拍摄的主体'}catch(e){tip.textContent='相机不可用：请检查权限，并使用 HTTPS 或 localhost'}};stage.onclick=e=>{const r=stage.getBoundingClientRect();pt={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};mark.style.display='block';mark.style.left=pt.x*100+'%';mark.style.top=pt.y*100+'%';let dx=2/3-pt.x,dy=.5-pt.y;if(Math.abs(dx)<.055&&Math.abs(dy)<.08)tip.textContent='✓ 构图位置已对齐';else if(Math.abs(dx)>Math.abs(dy))tip.textContent=dx>0?'← 手机向左转，让主体向右移动':'→ 手机向右转，让主体向左移动';else tip.textContent=dy>0?'↑ 抬高手机，让主体向下移动':'↓ 降低手机，让主体向上移动'};document.querySelector('#shot').onclick=()=>{if(!v.videoWidth){tip.textContent='请先启动摄像头';return}const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const ctx=c.getContext('2d');ctx.filter=filt();ctx.drawImage(v,0,0,c.width,c.height);const a=document.createElement('a');a.download='ai-camera-photo.png';a.href=c.toDataURL('image/png');a.click()};</script></html>
